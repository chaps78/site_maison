{% extends "core/base.html" %}

{% block titre %}Recettes – Maison{% endblock %}

{% block contenu %}
    <h1>Recettes</h1>
    <p>
        <a href="{% url 'recettes:recette_creer' %}">Créer une recette</a>
        —
        <a href="{% url 'recettes:types_ingredients_liste' %}">Types d'ingrédients</a>
    </p>
    <ul class="liste-catalogue">
        {% for recette in recettes %}
            <li><a href="{% url 'recettes:recette_detail' recette.pk %}">{{ recette.titre }}</a></li>
        {% empty %}
            <li>Aucune recette pour l'instant.</li>
        {% endfor %}
    </ul>
{% endblock %}
