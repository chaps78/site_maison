{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titre %}Maison{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'core:accueil' %}">Maison</a>
        {% if user.is_authenticated %}
            <span class="profil-courant">{{ user.first_name }}</span>
            <a href="{% url 'core:profils_liste' %}">Profils</a>
            <form action="{% url 'core:deconnexion' %}" method="post" class="form-deconnexion">
                {% csrf_token %}
                <button type="submit">Se déconnecter</button>
            </form>
        {% endif %}
    </header>
    <main>
        {% block contenu %}{% endblock %}
    </main>
</body>
</html>
